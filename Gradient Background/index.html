<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LivingTrust Home</title>

  
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"/>
  <link rel="stylesheet" href="index_style.css" />
</head>

<body>
    <div class="bg-img">
        <img src="logo.png" alt="company-logo" style="width: 10%; margin-left:3%; margin-top:0%; overflow:hidden; ">
        <div class="bgleft">
            <p class="welcome">WELCOME<br>BACK ...
                    <span class="mini">
                        Don't have an account ?
                    </span> 
                    <form action='/notreg' method="post">
                        <input type="submit" class="sign-up" value="sign up">
                    </form>
            </p>
        </div>
        <div class="bgright">
            <div class="content">
                <header>Login Form</header>
                    <div class="container">
                        <form action="/signin" method="post">
                            <div class="input-box">
                                <span class="icon"><i class="fas fa-envelope"></i></span>
                                <input type="text" placeholder="Email" name="email" required />
                            </div>
                            <div class="input-box space">
                                <span class="icon"><i class="fas fa-lock"></i></span>
                                <input type="password" placeholder="Password" name="password" required />
                                <span class="show">SHOW</span>
                            </div>
                            <div class="input-box space">
                                <input type="submit" class="input-box" value="LOGIN">
                            </div>
                        </form>
                    </div>
                    
            </div>
        </div>
        
</body>
</html>

<script>
        const pass_field = document.querySelector('.pass-key');
        const showBtn = document.querySelector('.show');
        showBtn.addEventListener('click', function(){
        if(pass_field.type === "password"){
        pass_field.type = "text";
        showBtn.textContent = "HIDE";
        showBtn.style.color = "#3498db";
        }else{
        pass_field.type = "password";
        showBtn.textContent = "SHOW";
        showBtn.style.color = "#222";
        }
        });
</script>
